<!doctype html>
<html lang="zh-CN" data-edition="customer">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf8ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="纸板报价">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="按尺寸和数量查询蜂窝纸板成品总价">
  <title>蜂窝纸板在线报价</title>
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-customer.png">
  <link rel="stylesheet" href="styles.css?v=4">
  <link rel="stylesheet" href="motion.css?v=3">
</head>
<body>
  <dialog class="entry-splash no-print" id="entrySplash" aria-labelledby="splashTitle">
    <div class="splash-content">
      <div class="splash-honeycomb" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="splash-caption">
        <strong id="splashTitle">蜂窝纸板在线报价</strong>
      </div>
    </div>
    <button type="button" class="splash-skip" id="skipSplash">跳过</button>
  </dialog>
  <header class="topbar">
    <a class="brand" href="#" aria-label="蜂窝纸板报价首页">
      <span class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <span>
        <strong>蜂窝纸板报价</strong>
      </span>
    </a>
    <button class="button ghost no-print" id="printButton" type="button" disabled>
      打印报价单
    </button>
  </header>

  <aside class="ios-hint no-print" id="iosHint" hidden>
    <strong>iPhone 使用提示</strong>
    <span>在 Safari 中点“分享”，再选择“添加到主屏幕”，以后可像 App 一样打开。</span>
  </aside>

  <main class="page-shell">
    <section class="intro">
      <div class="intro-copy">
        <h1>蜂窝纸板<br>在线报价</h1>
        <p>输入尺寸和数量，查看拼接方案与成品总价。</p>
      </div>
      <div class="hero-material" aria-hidden="true">
        <div class="material-cells">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </section>

    <div class="workspace">
      <section class="panel input-panel">
        <div class="section-heading">
          <h2>填写规格</h2>
        </div>

        <form id="quoteForm" novalidate>
          <div class="field-grid">
            <label class="field">
              <span>长度 <em>mm</em></span>
              <input id="length" name="length" type="number" min="1" step="1" value="800" inputmode="decimal" required>
            </label>
            <label class="field">
              <span>宽度 <em>mm</em></span>
              <input id="width" name="width" type="number" min="1" step="1" value="90" inputmode="decimal" required>
            </label>
            <label class="field wide">
              <span>所需厚度 <em>mm</em></span>
              <input id="thickness" name="thickness" type="number" min="1" max="5000" step="1" value="150" inputmode="numeric" required>
            </label>
            <label class="field">
              <span>数量 <em>件</em></span>
              <input id="quantity" name="quantity" type="number" min="1" step="1" value="1" inputmode="numeric" required>
            </label>
          </div>
          <p class="validation-message" id="validationMessage" role="alert" aria-live="polite"></p>
        </form>

      </section>

      <section class="panel result-panel" id="resultPanel" aria-live="polite">
        <div class="section-heading">
          <h2>报价结果</h2>
          <span class="date" id="quoteDate"></span>
        </div>

        <div id="validResult" hidden>
          <div class="quote-amount">
            <div class="result-label">成品总价</div>
            <div class="total-price"><span>¥</span><strong id="totalPrice"></strong></div>
            <p class="result-quantity">共 <span id="quantityText"></span> 件</p>
          </div>
          <div class="result-detail">
            <div class="result-block">
              <span>厚度拼接方案</span>
              <div class="layer-list" id="layerList"></div>
              <p id="layerSummary"></p>
            </div>
          </div>
        </div>

        <div class="empty-result" id="emptyResult">
          <h3 id="resultMessage">正在计算报价</h3>
          <p id="suggestionText"></p>
        </div>
      </section>
    </div>

    <footer>
      <span>页面价格供参考，实际报价以双方确认为准。</span>
      <button class="text-button" id="adminButton" type="button" aria-haspopup="dialog">管理员模式</button>
      <p id="adminNotice" role="status"></p>
    </footer>
  </main>

  <dialog class="admin-dialog no-print" id="adminDialog" aria-labelledby="adminTitle">
    <h2 id="adminTitle">管理员模式</h2>
    <form id="adminForm">
      <p id="adminHelp">请输入管理员密码。</p>
      <label class="field" id="setupField" hidden><span>初始化密钥</span>
        <input id="setupToken" type="password" autocomplete="off" maxlength="128"></label>
      <label class="field"><span id="adminPasswordLabel">管理员密码</span>
        <input id="adminPassword" type="password" autocomplete="current-password" required maxlength="128"></label>
      <div class="dialog-actions">
        <button class="text-button" id="closeAdmin" type="button">取消</button>
        <button class="button primary" id="adminSubmit" type="submit">进入</button>
      </div>
    </form>
    <form id="markupForm" hidden>
      <label class="field">
        <span>客户报价模式</span>
        <select id="markupMode" aria-describedby="activeMarkupMode markupHelp">
          <option value="fixed">固定加价</option>
          <option value="size">按尺寸加价</option>
        </select>
      </label>
      <p class="markup-help" id="activeMarkupMode"></p>
      <label class="field">
        <span>每件固定加价 <em>元/件</em></span>
        <input id="markupAmount" type="number" min="0" max="1000000" step="0.00001" inputmode="decimal" required>
      </label>
      <fieldset class="markup-anchors">
        <legend>按尺寸的基准加价 <em>元/件</em></legend>
        <p class="markup-help" id="anchorHelp">以 0.06 m² 的普通矩形整板为基准，按实际面积调整。异形件请人工核价。</p>
        <div class="markup-anchor-grid">
          <label class="field"><span>20 mm</span>
            <input id="markup20" type="number" min="0" max="1000000" step="0.00001" inputmode="decimal" aria-describedby="anchorHelp" required></label>
          <label class="field"><span>70 mm</span>
            <input id="markup70" type="number" min="0" max="1000000" step="0.00001" inputmode="decimal" aria-describedby="anchorHelp" required></label>
          <label class="field"><span>92 mm</span>
            <input id="markup92" type="number" min="0" max="1000000" step="0.00001" inputmode="decimal" aria-describedby="anchorHelp" required></label>
        </div>
      </fieldset>
      <p class="markup-help" id="markupHelp">可以先试算，保存设置后才会更新客户报价。</p>
      <div class="dialog-actions">
        <button class="text-button" id="exitAdmin" type="button" aria-label="关闭并退出管理员模式">退出</button>
        <button class="button ghost" id="previewMarkup" type="button">试算当前规格</button>
        <button class="button primary" id="saveMarkup" type="submit">保存设置</button>
      </div>
      <section class="markup-preview" id="markupPreview" aria-live="polite" aria-label="报价试算结果" hidden>
        <p class="markup-help" id="previewSpec"></p>
        <dl>
          <div><dt>固定加价</dt><dd id="previewFixed"></dd></div>
          <div><dt>按尺寸加价</dt><dd id="previewSize"></dd></div>
        </dl>
      </section>
    </form>
    <p class="admin-status" id="adminStatus" role="status"></p>
  </dialog>
  <script src="experience.js" defer></script>
  <script src="app.js?v=4" defer></script>
</body>
</html>
